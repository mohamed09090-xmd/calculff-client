name: Verify CalculFF Client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculff-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Complete generated Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=android \
            --org com.gm0h1 \
            --project-name calculff_client \
            .
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text = text.replace('com.gm0h1.calculff_client', 'com.gm0h1.calculffclient')
          path.write_text(text)
          assert 'applicationId = "com.gm0h1.calculffclient"' in text
          assert 'namespace = "com.gm0h1.calculffclient"' in text
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > debug-apk-sha256.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            debug-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
