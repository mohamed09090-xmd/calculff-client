name: Verify CalculFF Client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: calculff-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review working tree and pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git status --short
          git diff --check "$BASE_SHA...$HEAD_SHA"
          git diff --stat "$BASE_SHA...$HEAD_SHA"

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_API: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              'state': 'pending',
              'context': 'calculff-client/verify',
              'description': 'CalculFF Client verification is running',
              'target_url': os.environ['STATUS_TARGET'],
          }).encode()
          request = urllib.request.Request(
              os.environ['STATUS_API'],
              data=payload,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError('Commit status was not created.')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify repository safety and Android identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ['git', 'ls-files', '-z'],
          ).decode().split('\0')
          tracked = [path for path in tracked if path]

          forbidden_paths = [
              re.compile(r'(^|/)\.env($|\.)'),
              re.compile(r'(^|/)key\.properties$'),
              re.compile(r'\.(?:jks|keystore)$', re.IGNORECASE),
          ]
          bad_paths = [
              path for path in tracked
              if any(pattern.search(path) for pattern in forbidden_paths)
          ]
          if bad_paths:
              print('Forbidden sensitive paths are tracked:', file=sys.stderr)
              print('\n'.join(bad_paths), file=sys.stderr)
              raise SystemExit(1)

          secret_patterns = {
              'private key': re.compile(
                  r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
              ),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              'GitHub fine-grained token': re.compile(
                  r'github_pat_[A-Za-z0-9_]{20,}'
              ),
              'Supabase secret key': re.compile(
                  r'sb_secret_[A-Za-z0-9_-]{16,}'
              ),
              'JWT-like token': re.compile(
                  r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
              ),
              'Supabase project URL': re.compile(
                  r'https://[a-z0-9]{20}\.supabase\.co',
                  re.IGNORECASE,
              ),
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
          }

          findings = []
          for relative in tracked:
              path = Path(relative)
              if not path.is_file() or path.stat().st_size > 5_000_000:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      findings.append(f'{relative}: {label}')
          if findings:
              print('Potential secrets detected:', file=sys.stderr)
              print('\n'.join(findings), file=sys.stderr)
              raise SystemExit(1)

          gradle = Path('android/app/build.gradle').read_text()
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()
          assert 'applicationId = "com.gm0h1.calculffclient"' in gradle
          assert 'namespace = "com.gm0h1.calculffclient"' in gradle
          assert 'minSdk = 23' in gradle
          assert 'JavaVersion.VERSION_17' in gradle
          assert 'android:scheme="calculffclient"' in manifest
          assert 'android:host="auth-callback"' in manifest
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee flutter-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-test-log
          path: flutter-test.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk > /dev/null
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > debug-apk-sha256.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calculff-client-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            debug-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_API: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          STATUS_TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          succeeded = os.environ['JOB_STATUS'] == 'success'
          payload = json.dumps({
              'state': 'success' if succeeded else 'failure',
              'context': 'calculff-client/verify',
              'description': (
                  'CalculFF Client verification passed'
                  if succeeded
                  else 'CalculFF Client verification failed'
              ),
              'target_url': os.environ['STATUS_TARGET'],
          }).encode()
          request = urllib.request.Request(
              os.environ['STATUS_API'],
              data=payload,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError('Final commit status was not created.')
          PY
